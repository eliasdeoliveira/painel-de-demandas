services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Quatro barras: caminho absoluto dentro do contêiner.
      DATABASE_URL: sqlite:////app/data/zeeway.db
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - backend-data:/app/data
    healthcheck:
      # Usa o próprio Python da imagem para não precisar instalar curl.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # O navegador do usuário é quem chama a API, então a URL precisa ser a
        # publicada no host, e não o nome do serviço na rede do compose.
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
