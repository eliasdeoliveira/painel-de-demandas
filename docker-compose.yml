services:
  postgres:
    # Mesma versão principal usada em produção, para que o compose sirva de
    # ambiente de paridade e não só de conveniência.
    image: postgres:18-alpine
    environment:
      # Credenciais locais deste compose, sem valor fora dele: o banco não é
      # exposto para fora da rede interna. A URL de produção entra por variável
      # de ambiente no provedor, nunca neste arquivo.
      POSTGRES_USER: zeeway
      POSTGRES_PASSWORD: zeeway
      POSTGRES_DB: zeeway
    volumes:
      # A partir do PostgreSQL 18 as imagens guardam os dados em um subdiretório
      # por versão principal, então o volume monta o diretório pai. Montar em
      # /var/lib/postgresql/data, como se fazia até a 17, faz o contêiner
      # recusar iniciar.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeeway -d zeeway"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://zeeway:zeeway@postgres:5432/zeeway
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Usa o próprio Python da imagem para não precisar instalar curl.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # O navegador do usuário é quem chama a API, então a URL precisa ser a
        # publicada no host, e não o nome do serviço na rede do compose.
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
