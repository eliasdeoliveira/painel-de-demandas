# Os padrões abaixo reproduzem a execução local descrita no README: painel em
# http://localhost:3000 e API em http://localhost:8000. Um deploy sobrescreve o
# que precisar por variáveis de ambiente, sem alterar este arquivo — ver
# .env.example na raiz.
services:
  postgres:
    # Mesma versão principal usada em produção, para que o compose sirva de
    # ambiente de paridade e não só de conveniência.
    image: postgres:18-alpine
    environment:
      # O banco não publica porta: só é alcançável pela rede interna do compose.
      POSTGRES_USER: zeeway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeeway}
      POSTGRES_DB: zeeway
    volumes:
      # A partir do PostgreSQL 18 as imagens guardam os dados em um subdiretório
      # por versão principal, então o volume monta o diretório pai. Montar em
      # /var/lib/postgresql/data, como se fazia até a 17, faz o contêiner
      # recusar iniciar.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeeway -d zeeway"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORTS:-8000:8000}"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://zeeway:${POSTGRES_PASSWORD:-zeeway}@postgres:5432/zeeway}
      # Precisa listar a origem pública do painel; o navegador recusa a resposta
      # se o domínio de quem chamou não estiver aqui.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Usa o próprio Python da imagem para não precisar instalar curl.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Variáveis NEXT_PUBLIC_* são embutidas no bundle durante o build, e não
        # lidas em tempo de execução: quem chama a API é o navegador do usuário,
        # então este valor precisa ser a URL pública da API. Em plataformas de
        # deploy, marque-a como variável de BUILD — se ficar só como runtime, a
        # imagem sai com o padrão embutido e nenhuma requisição funciona.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORTS:-3000:3000}"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
